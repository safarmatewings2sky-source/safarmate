<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title"
>
  <title>SafarMate SM Logo</title>
  <!-- Outer soft border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#111827" />
  <!-- Inner card -->
  <rect x="5" y="5" width="54" height="54" rx="14" fill="#020617" />
  <!-- SM monogram -->
  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#F9FAFB"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="26"
    letter-spacing="0.08em"
  >
    SM
  </text>
</svg>